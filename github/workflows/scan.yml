name: SCC Crypto Scanner

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC), edit as you like
  workflow_dispatch: {}       # adds a manual "Run workflow" button too

permissions:
  contents: write            # needed so the workflow can save scanner_state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Persist scanner state (cooldown memory)
        run: |
          git config user.name "scc-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scanner_state.json
          git diff --cached --quiet || git commit -m "update scanner state"
          git push
